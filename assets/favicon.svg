<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Vitaliti">
  <!-- Favicon: cores explicitas de proposito. O vitaliti-mark.svg usa
       currentColor, que num favicon nao herda nada e renderiza preto. -->
